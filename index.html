<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>보건의료정보 실습관리 시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; background: #F3F4F6; color: #141E26; -webkit-font-smoothing: antialiased; }
  h1,h2,h3,p,dl,dd,dt,ul,li { margin: 0; }
  ul { list-style: none; padding: 0; }
  button { font-family: inherit; }
  [hidden] { display: none !important; }

  /* ===== 로그인 ===== */
  #auth { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: linear-gradient(135deg, #13212B 0%, #1C3A44 55%, #2E6B74 100%); }
  .auth-card { width: 100%; max-width: 400px; background: #fff; border-radius: 20px; box-shadow: 0 24px 60px rgba(19,33,43,.28); padding: 28px; }
  .brand { text-align: center; margin-bottom: 20px; }
  .brand h1 { font-size: 18px; font-weight: 800; color: #13212B; }
  .brand p { font-size: 12px; color: #6B7680; margin-top: 4px; }
  .tabsw { display: flex; gap: 6px; background: #F3F4F6; border-radius: 12px; padding: 4px; margin-bottom: 18px; }
  .tabsw button { flex: 1; border: 0; background: none; padding: 8px; border-radius: 9px; font-size: 13px; font-weight: 700; color: #6B7680; cursor: pointer; }
  .tabsw button.on { background: #fff; color: #245860; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .fld { margin-bottom: 12px; }
  .fld label { font-size: 12px; font-weight: 600; color: #3B4650; display: block; margin-bottom: 4px; }
  .fld input, .fld select { width: 100%; border: 1px solid #D5DBDF; border-radius: 10px; padding: 10px 12px; font-size: 14px; font-family: inherit; background: #fff; }
  .fld input:focus, .fld select:focus { outline: none; border-color: #2E6B74; box-shadow: 0 0 0 1px #2E6B74; }
  .btn-primary { width: 100%; border: 0; border-radius: 12px; padding: 12px; font-size: 14px; font-weight: 800; cursor: pointer; color: #FFFFFF; background: #2E6B74; }
  .muted { font-size: 12px; color: #6B7680; text-align: center; margin-top: 12px; }
  .swlink { background: none; border: 0; color: #2E6B74; font-weight: 700; cursor: pointer; font-size: 12px; text-decoration: underline; padding: 0; }
  .msg { border-radius: 10px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px; background: #FCEDEA; color: #C2412D; }
  .msg.ok { background: #E2F2EA; color: #25744B; }
  .hint { margin-top: 16px; border-top: 1px dashed #E3E7EA; padding-top: 12px; font-size: 11px; color: #9AA3AB; line-height: 1.9; }
  .hint b { color: #3B4650; }

  /* ===== 앱 셸 ===== */
  #app { display: flex; min-height: 100vh; }
  #sidebar { width: 236px; flex: none; background: #13212B; color: #E3E7EA; display: flex; flex-direction: column; }
  .sb-brand { padding: 18px 18px 14px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .sb-brand .t { font-size: 13px; font-weight: 800; color: #fff; }
  .sb-brand .s { font-size: 11px; color: #A6CDD1; margin-top: 3px; }
  .sb-nav { flex: 1; padding: 12px 10px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
  .sb-nav button { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; border: 0; background: none; color: #D5DBDF; font-size: 13px; font-weight: 600; padding: 9px 12px; border-radius: 9px; cursor: pointer; }
  .sb-nav button:hover { background: rgba(255,255,255,.07); color: #fff; }
  .sb-nav button.on { background: #2E6B74; color: #FFFFFF; }
  .sb-nav .ic { width: 16px; text-align: center; }
  .sb-foot { padding: 12px; border-top: 1px solid rgba(255,255,255,.08); font-size: 12px; }
  .sb-foot .nm { font-weight: 800; color: #fff; }
  .sb-foot .rl { color: #A6CDD1; margin: 2px 0 8px; }
  .sb-foot .em { color: #8D9AA4; font-size: 11px; margin-bottom: 8px; word-break: break-all; }
  .sb-foot button { width: 100%; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.1); color: #fff; border-radius: 9px; padding: 7px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .sb-foot button:hover { background: rgba(255,255,255,.22); }

  #main { flex: 1; min-width: 0; }
  .page-hd { background: #FFFFFF; color: #141E26; padding: 22px 28px; border-bottom: 1px solid #E3E7EA; }
  .page-hd h2 { font-size: 21px; font-weight: 700; letter-spacing: -.02em; }
  .page-hd p { font-size: 12.5px; color: #6B7680; margin-top: 4px; }
  .page-bd { padding: 22px 28px 40px; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid #E3E7EA; margin-bottom: 18px; flex-wrap: wrap; }
  .tabs button { border: 0; background: none; cursor: pointer; padding: 10px 14px; font-size: 13px; font-weight: 700; color: #6B7680; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button.on { color: #245860; border-bottom-color: #2E6B74; }

  .card { background: #fff; border: 1px solid #E3E7EA; border-radius: 16px; box-shadow: 0 1px 2px rgba(19,33,43,.04); margin-bottom: 18px; }
  .card-hd { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 18px; border-bottom: 1px solid #F3F4F6; }
  .card-hd h3 { font-size: 14px; font-weight: 700; }
  .card-hd .act { font-size: 12px; color: #6B7680; }
  .card-bd { padding: 16px 18px; }

  .grid { display: grid; gap: 14px; }
  .stats { grid-template-columns: repeat(2,1fr); }
  @media (min-width:700px){ .stats { grid-template-columns: repeat(4,1fr); } }
  .stat { border: 1px solid #E3E7EA; border-radius: 14px; padding: 14px 16px; background: #fff; }
  .stat.warn { background: #FBF3EA; border-color: #EFCFB3; }
  .stat .k { font-size: 12px; color: #6B7680; }
  .stat .v { font-size: 20px; font-weight: 800; margin-top: 3px; }

  .badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 600; line-height: 1.5; }
  .b-teal{background:#E3F0F1;color:#245860}.b-amber{background:#FBEBDD;color:#A1521B}.b-orange{background:#FBEBDD;color:#A1521B}
  .b-rose{background:#FCEDEA;color:#B23A28}.b-slate{background:#F3F4F6;color:#3B4650}.b-blue{background:#E3F0F1;color:#245860}
  .b-cyan{background:#DDEDF0;color:#2B6F80}.b-violet{background:#ede9fe;color:#6d28d9}

  .tw { overflow-x: auto; border: 1px solid #F3F4F6; border-radius: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { text-align: left; font-weight: 600; font-size: 12px; color: #6B7680; background: #F5F7F8; padding: 8px 10px; white-space: nowrap; }
  tbody td { padding: 8px 10px; border-top: 1px solid #F3F4F6; color: #2F3A44; vertical-align: middle; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.mut { color: #6B7680; } td.tiny { font-size: 12px; color: #9AA3AB; }
  tr.hl td { background: #FBF3EA; }

  input.cell, select.cell, textarea.in { border: 1px solid #D5DBDF; border-radius: 8px; padding: 6px 9px; font-size: 13px; font-family: inherit; background: #fff; }
  input.cell:focus, select.cell:focus, textarea.in:focus { outline: none; border-color: #2E6B74; box-shadow: 0 0 0 1px #2E6B74; }
  select.cell { max-width: 190px; }
  textarea.in { width: 100%; resize: vertical; }
  .lb { font-size: 12px; font-weight: 700; color: #3B4650; margin-bottom: 4px; display: block; }
  .fldrow { display: grid; gap: 12px; }
  @media (min-width:640px){ .fldrow.c3 { grid-template-columns: repeat(3,1fr); } }

  .btn { border-radius: 10px; padding: 8px 14px; font-size: 13px; font-weight: 700; cursor: pointer; border: 1px solid transparent; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-sm { padding: 5px 11px; font-size: 12px; border-radius: 8px; }
  .btn-teal { background: #2E6B74; color: #fff; } .btn-teal:not(:disabled):hover { background: #245860; }
  .btn-out { background: #fff; border-color: #D5DBDF; color: #3B4650; } .btn-out:hover { background: #F5F7F8; }
  .btn-danger { background: #fff; border-color: #EBB2A8; color: #B23A28; } .btn-danger:hover { background: #FCEDEA; }
  .btn-grad { background: #2E6B74; color: #FFFFFF; padding: 8px 18px; } .btn-grad:not(:disabled):hover { background: #245860; }
  .btnrow { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 12px; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .toolbar .sp { flex: 1; }
  .err { background: #FCEDEA; color: #C2412D; border-radius: 8px; padding: 7px 11px; font-size: 13px; }
  .notice { background: #F0F7F8; color: #245860; border-radius: 10px; padding: 10px 14px; font-size: 13px; }
  .empty { padding: 40px 0; text-align: center; color: #9AA3AB; font-size: 14px; }
  .sumline { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .sumchip { border: 1px solid #E3E7EA; border-radius: 10px; padding: 8px 12px; font-size: 12px; color: #3B4650; }
  .sumchip b { display: block; font-size: 15px; color: #13212B; margin-top: 2px; }
  .grouphd { font-size: 13px; font-weight: 800; color: #13212B; margin: 4px 0 10px; padding-left: 8px; border-left: 3px solid #2E6B74; }

  /* 리스트(학생/실습생 선택) */
  .pick { display: flex; flex-direction: column; gap: 8px; }
  .pick button { width: 100%; text-align: left; cursor: pointer; background: #fff; border: 1px solid #E3E7EA; border-radius: 12px; padding: 11px 14px; }
  .pick button:hover { border-color: #D5DBDF; background: #F5F7F8; }
  .pick button.on { border-color: #A6CDD1; background: #F0F7F8; }
  .pick .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .pick .nm { font-size: 14px; font-weight: 800; }
  .pick .no { font-size: 12px; color: #9AA3AB; }
  .pick .mt { font-size: 12px; color: #6B7680; margin-top: 5px; }
  .pick .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }

  /* 달력 */
  .cal { border: 1px solid #E3E7EA; border-radius: 14px; overflow: hidden; background: #fff; }
  .cal-hd { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid #F3F4F6; }
  .cal-hd .mo { font-size: 15px; font-weight: 800; }
  .cal-hd button { border: 1px solid #D5DBDF; background: #fff; border-radius: 8px; width: 30px; height: 30px; cursor: pointer; font-size: 15px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); }
  .cal-grid .dow { text-align: center; font-size: 11px; font-weight: 700; color: #9AA3AB; padding: 8px 0; }
  .cal-cell { min-height: 74px; border-top: 1px solid #F3F4F6; border-left: 1px solid #F3F4F6; padding: 5px 6px; position: relative; }
  .cal-cell:nth-child(7n+1) { border-left: 0; }
  .cal-cell.pad { background: #F7F8F9; }
  .cal-cell .d { font-size: 12px; color: #6B7680; }
  .cal-cell.today .d { font-weight: 800; color: #2E6B74; }
  .cal-cell button.mk { position: absolute; left: 5px; right: 5px; bottom: 5px; border: 0; border-radius: 7px; padding: 3px 4px; font-size: 10px; font-weight: 700; cursor: pointer; text-align: left; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .mk.st-DRAFT{background:#F3F4F6;color:#3B4650}.mk.st-SUBMITTED{background:#E3F0F1;color:#245860}
  .mk.st-MENTOR_REVIEWED{background:#DDEDF0;color:#2B6F80}.mk.st-RETURNED{background:#FBEBDD;color:#A1521B}.mk.st-APPROVED{background:#E3F0F1;color:#245860}
  .cal-cell button.add { position: absolute; left: 5px; right: 5px; bottom: 5px; border: 1px dashed #D5DBDF; background: #fff; border-radius: 7px; padding: 3px; font-size: 11px; color: #9AA3AB; cursor: pointer; }

  /* 서명 */
  .sigpad { margin-top: 10px; border: 1px solid #E3E7EA; border-radius: 12px; padding: 12px; background: #F5F7F8; }
  .sig-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .sig-canvas { width: 100%; max-width: 460px; height: 130px; margin: 8px 0; background: #fff; border: 1px dashed #D5DBDF; border-radius: 8px; touch-action: none; cursor: crosshair; display: block; }
  .sig-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: #3B4650; margin-top: 6px; }
  .sig-done { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  .sig-thumb { height: 40px; border: 1px solid #E3E7EA; border-radius: 6px; background: #fff; }

  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #13212B; color: #fff; padding: 10px 20px; border-radius: 999px; font-size: 14px; box-shadow: 0 10px 25px rgba(19,33,43,.25); z-index: 2147483000; max-width: 92vw; }

  /* ===== 추가: 중첩 사이드바 ===== */
  .sb-nav .sub { display: flex; flex-direction: column; gap: 2px; margin: 2px 0 4px 10px; padding-left: 8px; border-left: 1px solid rgba(255,255,255,.14); }
  .sb-nav .sub button { font-size: 12px; font-weight: 500; padding: 7px 10px; color: #B9C4CC; }
  .sb-nav .grphd { display:flex; align-items:center; gap:9px; width:100%; text-align:left; border:0; background:none; color:#D5DBDF; font-size:13px; font-weight:700; padding:9px 12px; border-radius:9px; cursor:pointer; }
  .sb-nav .grphd:hover { background: rgba(255,255,255,.07); color:#fff; }
  .sb-nav .grphd .cv { margin-left:auto; font-size:11px; color:#A6CDD1; }

  /* ===== 추가: RBAC 권한 트리 ===== */
  .perm-cat { border:1px solid #E3E7EA; border-radius:12px; overflow:hidden; margin-bottom:8px; }
  .perm-cat > .h { display:flex; align-items:center; gap:8px; background:#F5F7F8; padding:9px 12px; }
  .perm-cat .cnt { margin-left:auto; font-size:11px; color:#9AA3AB; }
  .perm-row { display:flex; gap:9px; padding:7px 12px; border-top:1px solid #f6f7f9; font-size:13px; }
  .perm-row.g { background:#E2F2EA; } .perm-row.r { background:#FBF5EE; }
  .perm-row .lab { flex:1; min-width:0; }
  .perm-row .desc { font-size:11px; color:#9AA3AB; margin-top:1px; }
  .perm-row .pk { font:10px ui-monospace,Menlo,Consolas,monospace; color:#D5DBDF; margin-top:1px; }
  .cbx { flex:none; width:17px; height:17px; border-radius:5px; border:1px solid #D5DBDF; background:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#fff; font-size:12px; font-weight:900; line-height:1; margin-top:1px; }
  .cbx.all { background:#2E6B74; border-color:#2E6B74; }
  .cbx.some { background:#C4DFE2; border-color:#A6CDD1; color:#245860; }
  .tag { font-size:10px; font-weight:800; border-radius:5px; padding:1px 5px; }
  .tag.g { background:#BFE3CF; color:#1D5C3B; } .tag.r { background:#EFCFB3; color:#6E4524; } .tag.e { background:#E3E7EA; color:#3B4650; }
  .rbcols { display:grid; gap:16px; align-items:start; }
  @media (min-width:900px){ .rbcols { grid-template-columns:280px 1fr; } }
  .rbcols > * { min-width:0; }

  /* ===== 추가: 만족도 5점 버튼 ===== */
  .scale { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:8px; }
  .scale button { border:1px solid #E3E7EA; border-radius:9px; padding:7px 2px; text-align:center; background:#fff; cursor:pointer; font-size:11px; color:#6B7680; }
  .scale button.on { border-color:#2E6B74; background:#F0F7F8; color:#245860; font-weight:800; }
  .scale button .n { display:block; font-size:14px; font-weight:800; }

  /* ===== 추가: 검토 달력 레이아웃 ===== */
  .rvcols { display:grid; gap:16px; align-items:start; }
  @media (min-width:900px){ .rvcols { grid-template-columns:290px 1fr; } }
  .rvcols > * { min-width:0; }
  .cal-cell { min-width:0; overflow:hidden; }
  .cal-cell .attd { position:absolute; right:5px; top:5px; width:6px; height:6px; border-radius:999px; }
  .legend { display:flex; flex-wrap:wrap; gap:12px; font-size:11px; color:#6B7680; margin-top:10px; }
  .legend i { width:10px; height:10px; border-radius:3px; display:inline-block; margin-right:4px; vertical-align:middle; }

  @media (max-width: 760px) {
    #app { flex-direction: column; }
    #sidebar { width: 100%; flex-direction: row; overflow-x: auto; }
    .sb-brand { display: none; }
    .sb-nav { flex-direction: row; flex: 1; }
    .sb-nav button { white-space: nowrap; }
    .sb-foot { display: flex; align-items: center; gap: 10px; border-top: 0; border-left: 1px solid rgba(255,255,255,.08); }
    .sb-foot .em { display: none; } .sb-foot .rl { display: none; }
    .sb-foot button { width: auto; }
  }

  /* ===== 실습 신청 (선발 기준 안내 · 실습 신청서) — .apx 범위 안에서만 적용 ===== */
  .apx { --line:#E3E7EA; --line-2:#D5DBDF; --line-3:#BFC7CD; --surface:#FFFFFF; --surface-2:#F5F7F8;
    --ink:#141E26; --ink-2:#3B4650; --ink-3:#6B7680; --ink-4:#9AA3AB;
    --brand:#2E6B74; --brand-700:#245860; --brand-500:#4F939B; --brand-300:#A6CDD1; --brand-100:#E3F0F1; --brand-50:#F0F7F8;
    --navy:#13212B; --warn-bg:#FBEBDD; --warn-ink:#A1521B; --note-bg:#F8EEE4; --note-ink:#6E4524; --ok-bg:#E2F2EA; --ok-ink:#25744B; --danger:#C2412D;
    --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--ink); font-size: 13px; line-height: 1.55; word-break: keep-all; }
  .apx .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .apx .acard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 1px 2px rgba(19,33,43,.04); padding: 22px; }
  .apx .acard + .acard { margin-top: 14px; }
  .apx h4 { font-size: 16px; margin: 0 0 4px; letter-spacing: -.01em; }
  .apx .sm { font-size: 12px; } .apx .mu { color: var(--ink-3); }
  .apx .sec-t { font-size: 16px; font-weight: 700; margin: 26px 0 12px; }
  .apx .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 5px; line-height: 1.5; white-space: nowrap; }
  .apx .tag.br { background: var(--brand-100); color: var(--brand); } .apx .tag.wn { background: var(--warn-bg); color: var(--warn-ink); }
  .apx .tag.gy { background: #EEF0F2; color: var(--ink-3); } .apx .tag.ok { background: var(--ok-bg); color: var(--ok-ink); }

  /* 점수 구성 */
  .apx .cmp-l { display: grid; grid-template-columns: 60fr 40fr; gap: 6px; margin: 14px 0 8px; }
  .apx .cmp-l div { font-size: 11px; font-weight: 700; padding-bottom: 6px; border-bottom: 2px solid; }
  .apx .cmp-l .q { color: var(--brand); border-color: var(--brand-300); } .apx .cmp-l .s { color: var(--ink); border-color: var(--navy); }
  .apx .sbar { display: flex; gap: 6px; height: 58px; }
  .apx .seg { border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; justify-content: center; overflow: hidden; white-space: nowrap; transform-origin: left; animation: apxGrow .7s cubic-bezier(.2,.8,.2,1) both; }
  .apx .seg b { font-size: 13px; } .apx .seg span { font-family: var(--mono); font-size: 11px; opacity: .85; } .apx .seg.c { align-items: center; }
  @keyframes apxGrow { from { transform: scaleX(.2); opacity: 0; } to { transform: none; opacity: 1; } }

  .apx .g3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
  .apx .crit { padding: 20px; margin: 0 !important; }
  .apx .crit-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }

function attSummary(list){
  var c={PRESENT:0,LATE:0,EARLY_LEAVE:0,ABSENT:0,HOLIDAY:0,MAKEUP:0};
  list.forEach(function(r){ c[r.status]=(c[r.status]||0)+1; });
  var counted=list.filter(function(r){return r.status!=="HOLIDAY";});
  var pres=counted.filter(function(r){return PRESENT_LIKE.indexOf(r.status)>=0;});
  c.rate = counted.length? Math.round(pres.length/counted.length*100):0;
  c.done = pres.length; c.days = counted.length;
  c.pending = list.filter(function(r){return r.approvalStatus==="PENDING";}).length;
  return c;
}
function logStat(sid){
  var ls=logsOf(sid);
  return { submitted: ls.filter(function(l){return l.status!=="DRAFT";}).length,
    approved: ls.filter(function(l){return l.status==="APPROVED";}).length,
    returned: ls.filter(function(l){return l.status==="RETURNED";}).length,
    pendingFaculty: 0,   // 지도교수 매회 승인 없음 (현장 담당자 결재로 승인 완료)
    pendingField: ls.filter(function(l){return l.status==="SUBMITTED";}).length };
}
/* 학번별 실습 기준 — 2025학번까지 3주 120시간, 2026학번부터 4주 160시간 */
function reqOf(s){
  var r = DB.term.rules, y = parseInt(String((s&&s.no)||"").slice(0,4), 10);
  var o = (isFinite(y) && y <= r.cohortUntil) ? r.old : r.neu;
  return { weeks:o.weeks, hours:o.hours, days:o.days, logs:o.logs, label:o.weeks+"주 "+o.hours+"시간" };
}
/* 지도교수 성적: 영역별 입력칸(교수마다 영역·배점 상이, 만점 100) */
function gradeAreasMax(){ return DB.grading.areas.reduce(function(t,a){ return t+(Number(a.max)||0); },0); }
function gradeTotal(sid){
  var sc = DB.grading.scores[sid]; if(!sc) return null;
  var ok = DB.grading.areas.every(function(a){ return sc[a.id]!=="" && sc[a.id]!=null && isFinite(Number(sc[a.id])); });
  if(!ok) return null;
  return Math.round(DB.grading.areas.reduce(function(t,a){ return t+Number(sc[a.id]); },0)*10)/10;
}
function finalScore(sid){ return gradeTotal(sid); }
/* 실습생 평가표(기관) 항목 — 기관별 세팅 */
function evalItemsFor(iid){ return (DB.evalItemsInst[iid] && DB.evalItemsInst[iid].length) ? DB.evalItemsInst[iid] : DB.evalItems.FIELD; }
function evalTotal(items, sc){
  var mx = items.reduce(function(t,it){ return t+(Number(it.max)||0); },0) || 1;
  var sum = items.reduce(function(t,it){ var v=Number(sc[it.id]); return t+(isFinite(v)?v:0); },0);
  return Math.round(sum*100/mx);
}
/* 사전교육 이수 확인 — 온라인 전 항목 이수 + 오프라인 사전교육 참석 확인 */

}

function initUsers(){
  USERS = loadUsers();

function sigHTML(prefix, defName, hint){

    '<label class="switch"><input type="checkbox" id="'+prefix+'_ok"> 위 내용을 확인하였으며 전자서명합니다.</label></div>';
}
function sigInit(prefix){
  var c=$(prefix+"_cv"); if(!c) return; var x=c.getContext("2d");
  x.lineWidth=2.2; x.lineCap="round"; x.lineJoin="round"; x.strokeStyle="#13212B";
  var draw=false,last=null;
  function pos(e){ var r=c.getBoundingClientRect(); var p=(e.touches&&e.touches[0])?e.touches[0]:e; return {x:(p.clientX-r.left)*(c.width/r.width), y:(p.clientY-r.top)*(c.height/r.height)}; }
  function dn(e){ draw=true; last=pos(e); if(e.cancelable)e.preventDefault(); }
  function mv(e){ if(!draw)return; var p=pos(e); x.beginPath(); x.moveTo(last.x,last.y); x.lineTo(p.x,p.y); x.stroke(); last=p; c.dataset.ink="1"; if(e.cancelable)e.preventDefault(); }
  function up(){ draw=false; }
  c.addEventListener("mousedown",dn); c.addEventListener("mousemove",mv); window.addEventListener("mouseup",up);
  c.addEventListener("touchstart",dn,{passive:false}); c.addEventListener("touchmove",mv,{passive:false}); c.addEventListener("touchend",up);
  var b=$(prefix+"_clr"); if(b) b.addEventListener("click",function(){ x.clearRect(0,0,c.width,c.height); c.dataset.ink=""; });
}
function sigRead(prefix){
  var c=$(prefix+"_cv"), n=$(prefix+"_name"), ok=$(prefix+"_ok");
  if(!c) return {ok:false,reason:"서명란 없음"};
  if(c.dataset.ink!=="1") return {ok:false,reason:"서명란에 직접 서명해 주세요."};
  var nm=n?n.value.trim():""; if(!nm) return {ok:false,reason:"서명자 이름을 입력하세요."};
  if(!ok||!ok.checked) return {ok:false,reason:"전자서명 동의에 체크해 주세요."};
  return {ok:true, name:nm, dataUrl:c.toDataURL("image/png"), signedAt:new Date().toISOString()};
}
function sigBlock(sig){
  if(!sig) return "";
  var img = sig.dataUrl ? '<img class="sig-thumb" src="'+sig.dataUrl+'" alt="서명">' : '';
  return '<div class="sig-done">'+img+'<span class="tiny">전자서명 · '+esc(sig.name)+' · '+esc(fmtDT(sig.signedAt))+'</span></div>';
}

  for (var k=0;k<os.length;k++){ os[k].addEventListener("click", function(){ opts.onOpen(this.getAttribute("data-open")); }); }
  var as = wrap.querySelectorAll("[data-add]");

(function(){ PERM_CATALOG.forEach(function(cat){ (function walk(ns,depth){ ns.forEach(function(n){
  PERM_FLAT.push({ key:n.key, label:n.label, desc:n.desc, cat:cat.key, depth:depth, leaf:!n.children });
  if (n.children) walk(n.children, depth+1);
}); })(cat.nodes,0); }); })();
var PERM_ALL = PERM_FLAT.map(function(p){ return p.key; });
function permDesc(k){ return [k].concat(PERM_ALL.filter(function(x){ return x.indexOf(k+".")===0; })); }
function permAnc(k){ var p=k.split("."), a=[]; for(var i=1;i<p.length;i++) a.push(p.slice(0,i).join(".")); return a.filter(function(x){ return PERM_ALL.indexOf(x)>=0; }); }
function permArea(c){ return PERM_FLAT.filter(function(p){ return p.cat===c; }).map(function(p){ return p.key; }); }
/* 초기 기본 권한 — 각 역할은 자기 영역 화면만. 지도교수는 '계정 권한 부여' 화면에서
   역할별/사용자별로 다른 역할의 화면 접근까지 켜고 끌 수 있으나(권한 부여 권한),
   지도교수 본인이 다른 역할 화면을 열람하지는 않는다. */
var DEFAULT_ROLE_PERMS = {
  STUDENT: permArea("AREA_STUDENT"),
  FACULTY: permArea("AREA_FACULTY"),
  LEAD: permArea("AREA_LEAD"),
  FIELD: permArea("AREA_FIELD"),
  STAFF: permArea("AREA_STAFF"),
  ADMIN: permArea("AREA_ADMIN")
};
function resolvePerms(role, ov, roleDefs){
  roleDefs = roleDefs || DEFAULT_ROLE_PERMS;
  var s = {}; (roleDefs[role]||[]).forEach(function(k){ s[k]=1; });
  if (ov){ (ov.revoke||[]).forEach(function(k){ delete s[k]; }); (ov.grant||[]).forEach(function(k){ s[k]=1; }); }
  return s;
}
function togglePerm(ov, role, key, next){
  var targets = permDesc(key), def = {}; (DEFAULT_ROLE_PERMS[role]||[]).forEach(function(k){ def[k]=1; });
  var g = {}, r = {}; (ov.grant||[]).forEach(function(k){ g[k]=1; }); (ov.revoke||[]).forEach(function(k){ r[k]=1; });
  targets.forEach(function(k){
    if (next){ delete r[k]; if (def[k]) delete g[k]; else g[k]=1; }
    else { delete g[k]; if (def[k]) r[k]=1; else delete r[k]; }
  });
  if (next) permAnc(key).forEach(function(a){ if(!def[a]) g[a]=1; delete r[a]; });
  return { grant:Object.keys(g), revoke:Object.keys(r) };
}
function toggleRoleDef(cur, key, next){
  var s = {}; cur.forEach(function(k){ s[k]=1; });
  permDesc(key).forEach(function(k){ if (next) s[k]=1; else delete s[k]; });
  if (next) permAnc(key).forEach(function(a){ s[a]=1; });
  return PERM_ALL.filter(function(k){ return s[k]; });
}
function permCatState(catKey, granted){
  var ks = PERM_FLAT.filter(function(p){ return p.cat===catKey; }).map(function(p){ return p.key; });
  var on = ks.filter(function(k){ return granted[k]; }).length;
  return on===0 ? "none" : on===ks.length ? "all" : "some";
}
function permNodeState(nk, granted){
  var ks = permDesc(nk), on = ks.filter(function(k){ return granted[k]; }).length;
  return on===0 ? "none" : on===ks.length ? "all" : "some";
}

/* 이미지 첨부 (실습일지·과제·학습 기록) — 800px로 축소해 메모리에만 보관 */
function readPhotos(files, cb){
  var arr = [].slice.call(files || []).filter(function(f){ return /^image\//.test(f.type); });
  var n = arr.length, out = [];
  if (!n){ cb([]); return; }
  function done(){ if (--n === 0) cb(out); }
  arr.forEach(function(f){
    var fr = new FileReader();
    fr.onerror = done;
    fr.onload = function(){
      var img = new Image();
      img.onerror = done;
      img.onload = function(){
        var k = Math.min(1, 800 / Math.max(img.width, img.height));
        var c = document.createElement("canvas"); c.width = Math.max(1, Math.round(img.width*k)); c.height = Math.max(1, Math.round(img.height*k));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        out.push({ name:f.name, dataUrl:c.toDataURL("image/jpeg", 0.72) }); done();
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(f);
  });
}

/* 신청자 목록 = 예시 10건 + 실제 학생 신청서(임시 저장·제출) */
function apxApplicants(){
  var list = apxSeedApps().slice();
  DB.students.forEach(function(s){
    var ex = DB.studentExtra[s.id], a = ex && ex.apply;
    if (a && (a.status === "SUBMITTED" || a.savedAt)) list.push({ id:"stu_"+s.id, sid:s.id, name:s.name, no:s.no, a:a });

}
function apxNorm(n){ return String(n||"").replace(/\s+/g, "").toLowerCase(); }
/* 신청서의 n순위 기관명을 실습기관 목록과 연결 (교수가 직접 연결한 값 우선) */
function apxChoiceInst(app, i){
  var m = (apxSel().map[app.id]||{})[i];
  var insts = apxInsts();
  if (m) return insts.filter(function(x){ return x.id === m; })[0] || null;
  var n = apxNorm(app.a.hosp[i] && app.a.hosp[i].name); if (!n) return null;
  return insts.filter(function(x){ return apxNorm(x.name) === n; })[0] || null;
}
function apxCertList(a){
  return (a.certs||[]).map(function(c){
    var nm = c.name === "__other" ? c.other.trim() : c.name;
    return nm ? { name:nm, ok: c.name !== "__other" && APX.CERTS.indexOf(c.name) >= 0 } : null;
  }).filter(Boolean);
}
function apxScore(app){
  var a = app.a, sel = apxSel();
  var g = parseFloat(a.gpa); g = isNaN(g) ? 0 : Math.max(0, Math.min(APX.GPA_CRIT_MAX, g));
  var gp = Math.round(g / APX.GPA_CRIT_MAX * 400) / 10;
  var certs = apxCertList(a), cn = certs.filter(function(c){ return c.ok; }).length, cp = apxCertPts(cn);
  var isToeic = a.eng && a.eng.test === "TOEIC" && String(a.eng.score).trim() !== "";
  var t = isToeic ? parseInt(a.eng.score, 10) : null; if (isNaN(t)) t = null;
  var tp = apxToeicPts(t);
  var quant = Math.round((gp + cp + tp) * 10) / 10;
  var intro = sel.scores[app.id]; intro = (intro === undefined || intro === "" || intro === null) ? null : Number(intro);
  return { gpa:g, gp:gp, certs:certs, cn:cn, cp:cp, toeic:t, tp:tp, quant:quant, intro:intro, total: Math.round((quant + (intro||0)) * 10) / 10 };
}
/* 배정: 1순위 → 2순위 → 3순위 순서로, 정원이 남은 기관만 다음 순위 신청자를 점수순으로 받음 */
function apxAllocate(apps){
  var insts = apxInsts().filter(function(x){ return x.open; });
  var seats = {}; insts.forEach(function(x){ seats[x.id] = Number(x.cap)||0; });
  var sc = {}; apps.forEach(function(p){ sc[p.id] = apxScore(p); });
  var res = {}, notes = {};
  function cmp(x, y){ var A = sc[x.id], B = sc[y.id]; return (B.total - A.total) || (B.quant - A.quant) || (B.gpa - A.gpa); }
  var pool = apps.filter(function(p){ return p.a.status === "SUBMITTED"; });
  for (var r = 0; r < 3; r++){
    var byInst = {};
    pool.forEach(function(p){
      if (res[p.id]) return;
      var it = apxChoiceInst(p, r); if (!it || seats[it.id] === undefined) return;
      if (it.cond && !(apxSel().cond[p.id]||{})[it.cond]){ (notes[p.id] = notes[p.id]||[]).push((r+1)+"순위 조건 미충족"); return; }
      (byInst[it.id] = byInst[it.id]||[]).push(p);
    });
    Object.keys(byInst).forEach(function(iid){
      byInst[iid].sort(cmp).forEach(function(p){
        if (seats[iid] > 0){ seats[iid]--; res[p.id] = { inst: insts.filter(function(x){ return x.id===iid; })[0], round: r+1 }; }
      });
    });
  }
  return { res:res, notes:notes, seats:seats, scores:sc, insts:insts };
}

        '<td><input class="ip mono sc-in" type="number" min="0" max="40" step="0.5" inputmode="decimal" data-sc="'+p.id+'" value="'+(s.intro==null?"":s.intro)+'" placeholder="-" aria-label="'+esc(p.name)+' 자기소개 점수"'+(locked?' disabled':'')+'>' +
          '<button type="button" class="lnk sm" data-read="'+p.id+'">자기소개서 읽기</button></td>' +
        '<td class="tot mono"></td>' +
        '<td><ol class="chl">'+p.a.hosp.map(function(x){ return x.name.trim(); }).filter(Boolean).map(function(n){ return '<li title="'+esc(n)+'">'+esc(n)+'</li>'; }).join("")+'</ol><div class="asgc"></div></td></tr></tbody></table>').querySelector("tr");
      rowEl[p.id] = tr; tb.appendChild(tr);
    });
    function refresh(reorder){
      var al = apxAllocate(apps);
      var order = apps.slice().sort(function(x, y){ var A = al.scores[x.id], B = al.scores[y.id]; return (B.total - A.total) || (B.quant - A.quant) || (B.gpa - A.gpa); });
      order.forEach(function(p, i){
        var tr = rowEl[p.id], s = al.scores[p.id];
        tr.querySelector(".rk").textContent = i+1;
        tr.querySelector(".tot").innerHTML = s.intro==null ? '<span class="mu">'+s.quant.toFixed(1)+'</span><div class="tiny mu">미채점</div>' : '<b>'+s.total.toFixed(1)+'</b>';
        tr.querySelector(".asgc").innerHTML = asgHTML(p, al);
        tr.classList.toggle("unscored", s.intro==null);
      });
      if (reorder){
        var f = document.activeElement;
        order.forEach(function(p){ tb.appendChild(rowEl[p.id]); });
        if (f && f !== document.activeElement && document.body.contains(f)) f.focus();
      }
      summary(al);
    }
    tb.addEventListener("input", function(e){
      var el = e.target, id = el.getAttribute("data-sc"); if (!id) return;
      var v = el.value === "" ? null : Math.max(0, Math.min(40, Number(el.value)));
      el.classList.toggle("err", el.value !== "" && (isNaN(Number(el.value)) || Number(el.value) < 0 || Number(el.value) > 40));
      if (v === null || isNaN(v)) delete sel.scores[id]; else sel.scores[id] = v;
      refresh(false);
    });
    tb.addEventListener("change", function(e){
      var el = e.target; if (!el.getAttribute("data-sc")) return;
      if (el.value !== "" && sel.scores[el.getAttribute("data-sc")] !== undefined) el.value = sel.scores[el.getAttribute("data-sc")];
      refresh(true);
    });
    tb.addEventListener("click", function(e){
      var b = e.target.closest("[data-read]"); if (!b) return;
      var p = apps.filter(function(x){ return x.id === b.getAttribute("data-read"); })[0];
      modal('<h4>'+esc(p.name)+' · 자기소개서</h4><p class="mu sm" style="margin:2px 0 12px">'+esc(p.no)+' · '+p.a.intro.length.toLocaleString()+'자</p>' +
        '<div class="readbox">'+esc(p.a.intro)+'</div><div class="macts"><button type="button" class="b pr" data-close>닫기</button></div>');
    });
    refresh(true);
  } else {
    var al = apxAllocate(apps);
    var cards = al.insts.map(function(it){
      var got = apps.filter(function(p){ return al.res[p.id] && al.res[p.id].inst.id === it.id; }).sort(function(x,y){ return al.scores[y.id].total - al.scores[x.id].total; });
      var cap = Number(it.cap)||0, left = cap - got.length;
      return '<div class="icard"><div class="ich"><div><span class="tag gy">'+esc(it.grp)+'</span><h5>'+esc(it.name)+'</h5>'+(it.cond?'<div class="cond sm">'+esc(it.cond)+'</div>':'')+'</div>' +
        '<div class="icnt"><b class="mono">'+got.length+'</b><span class="mono mu"> / '+cap+'</span></div></div>' +
        '<div class="ibar"><i style="width:'+(cap?Math.min(100, got.length/cap*100):0)+'%"></i></div>' +
        (got.length ? '<ul class="ilist">'+got.map(function(p){ return '<li><span>'+esc(p.name)+' <span class="mu mono sm">'+esc(p.no)+'</span></span><span class="mono sm">'+al.scores[p.id].total.toFixed(1)+' · '+al.res[p.id].round+'순위</span></li>'; }).join("")+'</ul>' : '<p class="mu sm" style="margin:8px 0 0">배정된 학생이 없습니다.</p>') +
        (left > 0 ? '<div class="tiny wn-t">정원 미달 '+left+'석 · 추가모집 공고 대상</div>' : '') + '</div>';
    }).join("");
    var extra = apps.filter(function(p){ return !al.res[p.id]; });
    body.innerHTML = '<div class="igrid">'+cards+'</div>' +
      '<div class="xtra"><h5>추가모집 대상 '+extra.length+'명</h5>' + (extra.length ? '<ul class="ilist">'+extra.map(function(p){ return '<li><span>'+esc(p.name)+' <span class="mu mono sm">'+esc(p.no)+'</span> <span class="mu sm">'+choiceLine(p)+'</span></span><span class="sm mu">'+esc((al.notes[p.id]||["1~3순위 모두 정원 마감"]).join(" · "))+'</span></li>'; }).join("")+'</ul>' : '<p class="mu sm">없습니다.</p>') +
      '<p class="mu sm" style="margin-top:10px">추가모집 공고는 1~3순위 배정이 모두 끝난 뒤 정원 미달 기관을 대상으로 따로 나갑니다.</p></div>';
    summary(al);
  }

  function summary(al){
    var scored = apps.filter(function(p){ return al.scores[p.id].intro != null; }).length;
    var assigned = Object.keys(al.res).length, un = apps.length - scored;
    $("kApp").textContent = apps.length; $("kScored").textContent = scored; $("kScoredOf").textContent = "/ "+apps.length;
    $("kAssigned").textContent = assigned; $("kExtra").textContent = apps.length - assigned;
    var bn = $("selBanner");
    bn.className = "sel-banner" + (locked ? " ok" : un ? "" : " ok");
    bn.innerHTML = locked ? '배정을 확정하고 학생에게 통보했습니다. 점수를 고치려면 <b>확정 취소</b> 후 다시 확정하세요.'
      : un ? '자기소개 미채점 <b>'+un+'명</b>이 있어 배정 결과는 <b>잠정</b>입니다. 채점을 마치면 배정을 확정할 수 있습니다.'
      : '모든 신청서의 자기소개 채점을 마쳤습니다. 결과를 확인하고 <b>배정 확정 · 학생 통보</b>를 누르세요.';
    var cb = $("selConfirm"); if (cb) cb.disabled = !!un || !apps.length;
  }
  var cbtn = $("selConfirm");
  if (cbtn) cbtn.addEventListener("click", function(){
    var al = apxAllocate(apps), n = Object.keys(al.res).length;
    modal('<h4>배정을 확정할까요?</h4><p>배정 '+n+'명, 추가모집 대상 '+(apps.length-n)+'명입니다. 확정하면 학생 신청서 화면에 배정 결과가 표시됩니다.</p>' +
      '<div class="macts"><button type="button" class="b" data-close>다시 확인</button><button type="button" class="b pr" id="selOk">확정 · 통보</button></div>');
    $("selOk").addEventListener("click", function(){
      var out = {}; apps.forEach(function(p){ var r = al.res[p.id]; out[p.id] = r ? { inst:r.inst.name, round:r.round } : null; });
      sel.confirmed = { at:new Date().toISOString(), result:out };
      closeM(); renderMain(); toast("배정을 확정하고 학생에게 통보했습니다.");
    });
  });
  var ub = $("selUndo");
  if (ub) ub.addEventListener("click", function(){ sel.confirmed = null; renderMain(); toast("배정 확정을 취소했습니다."); });
};

        '<td><input class="ip mono" type="number" min="0" data-f="cap" data-id="'+it.id+'" value="'+esc(it.cap)+'" aria-label="정원" style="width:76px"></td>' +
        '<td><input class="ip" data-f="cond" data-id="'+it.id+'" value="'+esc(it.cond)+'" placeholder="없음" aria-label="필수 조건"></td>' +
        '<td><label class="ck"><input type="checkbox" data-f="open" data-id="'+it.id+'"'+(it.open?' checked':'')+'> 모집</label></td>' +
        '<td><button type="button" class="b gh" data-del="'+it.id+'" aria-label="기관 삭제">'+APX.IC.del+'</button></td></tr>';
    }).join("") + '</tbody></table></div>' +
    '<div class="addrow"><select class="ip" id="niGrp">'+GR.map(function(g){ return '<option>'+g+'</option>'; }).join("")+'</select><input class="ip" id="niName" placeholder="새 기관명"><input class="ip mono" id="niCap" type="number" min="0" placeholder="정원"><input class="ip" id="niCond" placeholder="필수 조건 (없으면 비워 두기)"><button type="button" class="b pr" id="niAdd">'+APX.IC.plus+' 기관 추가</button></div>' +
    '<p class="tiny mu" style="margin:10px 0 0">모집을 끄면 학생 목록과 배정에서 빠집니다. 필수 조건 문구가 같은 기관끼리는 [신청서 현황]의 조건 확인을 함께 씁니다.</p></div></div>');

  $("niAdd").addEventListener("click", function(){

/* ============================================================ *

var GOAL = {

function goalData(ex){
  if (!ex.goal) ex.goal = { tasks:[], taskEtc:"", goals:[{t:"",how:"",ach:""},{t:"",how:"",ach:""},{t:"",how:"",ach:""}], pre:{}, preAt:null, post:{}, postAt:null, savedAt:null };
  return ex.goal;
}
function goalAvg(map, list){ var v = list.map(function(c){ return Number(map[c.name]); }).filter(function(x){ return x > 0; }); return v.length ? v.reduce(function(a,b){ return a+b; }, 0) / v.length : null; }

      '<div class="acard sbar2"><div class="remain" id="gdRemain"></div><div class="bacts"><button type="button" class="b" id="gdSave">저장</button><button type="button" class="b pr" id="gdNext">저장하고 사전 진단으로</button></div></div>';

                   : { title:"", area:s.area, hrs:8, pc:"", lc:"", rf:"", photos:[] };

      '<div class="fldrow c3">' +
        '<label class="lb">실습 영역<select class="cell" id="jArea" style="max-width:none">'+PRACTICE_AREAS.map(function(a){return '<option'+(a===jd.area?' selected':'')+'>'+a+'</option>';}).join("")+'</select></label>' +
        '<label class="lb">실습 시간<input class="cell" id="jHrs" type="number" min="0" max="24" step="0.5" value="'+esc(jd.hrs)+'" style="width:100%"></label>' +
        '<label class="lb">일자<input class="cell" id="jDate" type="date" value="'+esc(ds)+'" style="width:100%" disabled></label>' +

    var g = grab();
    if (status==="SUBMITTED"){
      if(!g.title){ return ferr("제목을 입력하세요."); }
      if(g.pc.length<10){ return ferr("실습 내용을 10자 이상 입력하세요."); }
      if(g.rf.length<10){ return ferr("소감을 10자 이상 입력하세요."); }

  $("jSave").addEventListener("click", function(){ persist("DRAFT"); });
  $("jSubmit").addEventListener("click", function(){ persist("SUBMITTED"); });
}

/* 만족도 조사 공용 폼 (학생용 · 기관용) — 5점 리커트(매우 그렇다 → 전혀 그렇지 않다) */
var LIKERT_LABELS = ["전혀 그렇지 않다","그렇지 않다","보통이다","그렇다","매우 그렇다"];
function surveySections(items){
  var secs = [], byId = {};
  (items || DB.surveyItems).forEach(function(q){
    var key = q.section || "기타";
    if (!byId[key]){ byId[key] = { title:key, items:[] }; secs.push(byId[key]); }
    byId[key].items.push(q);
  });
  return secs;
}
function surveyScaleIds(items){ return (items || DB.surveyItems).filter(function(q){ return q.type==="scale"; }).map(function(q){ return q.id; }); }
function renderSurveyForm(host, cfg){
  var st = UI[cfg.key] = UI[cfg.key] || { edit:false, ans: cfg.mine ? clone(cfg.mine.answers) : {} };
  var editing = !cfg.mine || st.edit;
  var reqIds = surveyScaleIds(cfg.items);
  var answered = reqIds.filter(function(id){ return Number(st.ans[id]) > 0; }).length;
  var vals = reqIds.map(function(id){ return Number(st.ans[id]); }).filter(function(v){ return v>0; });
  var avg = vals.length ? Math.round(vals.reduce(function(a,b){return a+b;},0)/vals.length*100)/100 : null;
  if (cfg.head) host.appendChild(h(cfg.head));
  if (cfg.mine && !editing) host.appendChild(h('<div class="notice" style="background:#F0F7F8;color:#245860;margin-bottom:14px">제출이 완료되었습니다. '+esc(cfg.doneNote||"")+(avg!=null?' <b style="float:right">척도 평균 '+avg+' / 5</b>':'')+'</div>'));
  surveySections(cfg.items).forEach(function(sec){
    var rows = sec.items.map(function(q){
      var cur = Number(st.ans[q.id]) || 0;
      if (q.type==="text"){
        var tv = st.ans[q.id] || "";
        return '<div style="padding:11px 0;border-top:1px solid #F3F4F6"><label class="lb" style="font-weight:500">'+esc(q.text)+'</label>' +
          (editing ? '<textarea class="in" data-q="'+q.id+'" rows="3">'+esc(tv)+'</textarea>'
                   : '<p style="background:#F5F7F8;border-radius:8px;padding:7px 10px;font-size:13px;color:#6B7680;white-space:pre-wrap">'+esc(String(tv).trim()||"(응답 없음)")+'</p>') + '</div>';
      }
      return '<div style="padding:11px 0;border-top:1px solid #F3F4F6"><div style="display:flex;justify-content:space-between;gap:8px"><span style="font-size:13px;font-weight:500">'+esc(q.text)+' <span style="color:#E0806F">*</span></span>'+(cur?'<span class="tiny" style="font-weight:800;color:#245860;white-space:nowrap">'+cur+' · '+esc(LIKERT_LABELS[cur-1])+'</span>':'')+'</div>' +
        '<div class="scale">'+[5,4,3,2,1].map(function(n){ return '<button type="button" data-q="'+q.id+'" data-n="'+n+'" class="'+(cur===n?"on":"")+'" '+(editing?"":"disabled")+'><span class="n">'+n+'</span>'+esc(LIKERT_LABELS[n-1])+'</button>'; }).join("")+'</div></div>';
    }).join("");
    host.appendChild(h(card(sec.title, "", rows)));
  });
  if (cfg.mine && !editing){
    host.appendChild(h('<div class="btnrow"><button type="button" class="btn btn-out" id="svEditBtn">응답 수정</button></div>'));
    $("svEditBtn").addEventListener("click", function(){ st.edit = true; renderMain(); });
    return;
  }
  host.appendChild(h('<div class="card"><div class="card-bd" style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span class="tiny">필수 응답 <b style="color:#245860">'+answered+'</b> / '+reqIds.length+'</span><p class="err" id="svErr" hidden style="margin:0"></p><span style="flex:1"></span>'+(cfg.mine?'<button type="button" class="btn btn-sm btn-out" id="svCancel">취소</button>':'')+'<button type="button" class="btn btn-grad" id="svSubmit">'+(cfg.mine?"수정 제출":"제출하기")+'</button></div></div>'));
  host.querySelectorAll("[data-q][data-n]").forEach(function(b){ b.addEventListener("click", function(){ st.ans[this.getAttribute("data-q")] = Number(this.getAttribute("data-n")); renderMain(); }); });
  host.querySelectorAll("textarea[data-q]").forEach(function(t){ t.addEventListener("input", function(){ st.ans[this.getAttribute("data-q")] = this.value; }); });
  var cn = $("svCancel"); if (cn) cn.addEventListener("click", function(){ st.edit=false; st.ans = cfg.mine ? clone(cfg.mine.answers) : {}; renderMain(); });
  $("svSubmit").addEventListener("click", function(){
    var miss = reqIds.filter(function(id){ return !(Number(st.ans[id])>0); });
    if (miss.length){ $("svErr").textContent = "척도 문항 "+miss.length+"개에 응답해 주세요."; $("svErr").hidden=false; return; }
    cfg.onSubmit(clone(st.ans)); st.edit=false; renderMain(); toast("만족도 조사가 제출되었습니다.");
  });
}

RENDER.FACULTY.home = function(){
  var list = studentsForFaculty(SESSION.id);
  var byInst = {}; list.forEach(function(s){ (byInst[s.institutionId]=byInst[s.institutionId]||[]).push(s); });
  var attWarn = [], logWarn = [];
  var peerDone = 0, peerSub = 0;
  list.forEach(function(s){ peerDone = Math.max(peerDone, attSummary(attOf(s.id)).done); peerSub = Math.max(peerSub, logStat(s.id).submitted); });
  list.forEach(function(s){
    var a = attSummary(attOf(s.id)), lg = logStat(s.id);
    var whyA = [];
    if (a.ABSENT > 0) whyA.push("결석 "+a.ABSENT);
    if (a.LATE >= 2) whyA.push("지각 "+a.LATE);
    if (a.pending > 0) whyA.push("출결 미승인 "+a.pending);
    if (peerDone - a.done >= 2) whyA.push("출석 누계 부족("+a.done+"/"+peerDone+"일)");
    if (whyA.length) attWarn.push({ s:s, why:whyA.join(" · ") });
    var whyL = [];
    if (lg.returned > 0) whyL.push("보완요청 "+lg.returned);
    if (lg.pendingField >= 2) whyL.push("현장 결재 대기 "+lg.pendingField);
    if (peerSub - lg.submitted >= 2) whyL.push("일지 미작성("+lg.submitted+"/"+peerSub+"건)");
    if (whyL.length) logWarn.push({ s:s, why:whyL.join(" · ") });
  });
  pageShell("홈", SESSION.name + " · 담당 학생 " + list.length + "명 · 실습기관 " + Object.keys(byInst).length + "곳", "");
  var host = pbody();
  host.appendChild(h('<div class="grid stats">' +
    '<div class="stat"><div class="k">담당 학생</div><div class="v">'+list.length+'명</div></div>' +
    '<div class="stat"><div class="k">파견 실습기관</div><div class="v">'+Object.keys(byInst).length+'곳</div></div>' +
    '<div class="stat'+(attWarn.length?' warn':'')+'"><div class="k">출결 주의</div><div class="v">'+attWarn.length+'명</div></div>' +
    '<div class="stat'+(logWarn.length?' warn':'')+'"><div class="k">실습일지 주의</div><div class="v">'+logWarn.length+'명</div></div>' +
    '</div>'));
  // 기관별 인원
  var irows = Object.keys(byInst).map(function(iid){
    var g = byInst[iid];
    var avgAtt = Math.round(g.reduce(function(t,s){ return t+pct(attSummary(attOf(s.id)).done, reqOf(s).days); },0)/g.length);

RENDER.FACULTY.accounts = function(){

    granted = resolvePerms(u.role, ov, r.roleDefs);

  pageShell("계정 권한 부여", "역할별 기본 접근 권한을 세팅하고, 필요 시 사용자 단위로 화면 접근을 켜고 끕니다. (계정 생성·삭제는 시스템 관리자)", "");
  var host = pbody();

  var tools = h('<div class="toolbar">' +
    '<div class="tabs" style="margin:0;border:0"><button type="button" data-mode="role" class="'+(r.mode==="role"?"on":"")+'">역할 기본 권한</button>' +
    '<button type="button" data-mode="user" class="'+(r.mode==="user"?"on":"")+'">사용자별 권한</button></div>' +
    '<button type="button" class="btn btn-sm btn-out" id="rbReset">'+(r.mode==="role"?"시스템 기본값으로":"역할 기본값으로 초기화")+'</button>' +
    '<span class="sp"></span><span class="tiny">허용 '+gcount+' / '+PERM_ALL.length+'</span>' +
    '<button type="button" class="btn btn-sm btn-grad" id="rbSave">변경 사항 저장</button></div>');
  host.appendChild(tools);

  var cols = h('<div class="rbcols"></div>');
  var left = h('<div class="card"><div class="card-bd" id="rbLeft"></div></div>');
  var right = h('<div class="card"><div class="card-hd"><h3 id="rbTitle"></h3><span class="act" id="rbAct"></span></div><div class="card-bd" id="rbTree"></div></div>');
  cols.appendChild(left); cols.appendChild(right); host.appendChild(cols);

  // 좌측
  if (r.mode==="role"){
    $("rbLeft").innerHTML = '<p class="tiny" style="margin:0 0 8px">역할 선택 · 저장 시 해당 역할 전체 사용자에 적용</p>' +

      }).join("");
  } else {
    var q = (r.q||"").trim().toLowerCase();
    var list = users.filter(function(u){ return !q || u.name.toLowerCase().indexOf(q)>=0 || String(u.loginId).toLowerCase().indexOf(q)>=0 || String(u.email||"").toLowerCase().indexOf(q)>=0; });
    $("rbLeft").innerHTML = '<input class="cell" id="rbQ" placeholder="이름·아이디·이메일 검색" value="'+esc(r.q||"")+'" style="width:100%;margin-bottom:10px">' +
      '<div class="pick">' + list.map(function(u){

      }).join("") + '</div>';
  }

  // 우측 트리
  $("rbTitle").textContent = r.mode==="role" ? (ROLES[r.role]+" 기본 권한") : ((users.filter(function(x){return x.id===r.userId;})[0]||{}).name + " 개별 권한");

      (function walk(ns, depth){ ns.forEach(function(n){
        var ns2 = n.children ? permNodeState(n.key, granted) : (granted[n.key] ? "all" : "none");
        var dk = diff[n.key];
        rows += '<div class="perm-row '+(dk==="g"?"g":dk==="r"?"r":"")+'" style="padding-left:'+(12+depth*20)+'px">' +
          '<span class="cbx '+(ns2==="all"?"all":ns2==="some"?"some":"")+'" data-k="'+n.key+'" data-next="'+(ns2==="all"?"0":"1")+'">'+(ns2==="all"?"✓":ns2==="some"?"–":"")+'</span>' +
          '<span class="lab"><span style="font-weight:500;color:'+(ns2==="all"?"#2F3A44":"#9AA3AB")+'">'+esc(n.label)+'</span>' +
          (n.entry?' <span class="tag e">기본 진입</span>':'') + (dk==="g"?' <span class="tag g">추가 허용</span>':dk==="r"?' <span class="tag r">제한</span>':'') +
          (n.desc?'<div class="desc">'+esc(n.desc)+'</div>':'') + '<div class="pk">'+esc(n.key)+'</div></span></div>';
        if (n.children) walk(n.children, depth+1);
      }); })(cat.nodes, 0);
    }
    var onCat = PERM_FLAT.filter(function(p){ return p.cat===cat.key && granted[p.key]; }).length;
    return '<div class="perm-cat"><div class="h"><span style="color:#9AA3AB;cursor:pointer;font-size:11px" data-toc="'+cat.key+'">'+(open?"▼":"▶")+'</span>' +
      '<span class="cbx '+(st==="all"?"all":st==="some"?"some":"")+'" data-cat="'+cat.key+'">'+(st==="all"?"✓":st==="some"?"–":"")+'</span>' +
      '<b style="font-size:13px">'+esc(cat.label)+'</b><span class="badge b-slate">'+esc(ROLES[cat.owner])+'</span>' +
      '<span class="cnt">'+onCat+' / '+PERM_FLAT.filter(function(p){return p.cat===cat.key;}).length+'</span></div>' + rows + '</div>';
  }).join("");

  tools.querySelectorAll("[data-mode]").forEach(function(b){ b.addEventListener("click", function(){ r.mode=this.getAttribute("data-mode"); renderMain(); }); });
  $("rbReset").addEventListener("click", function(){

    renderMain(); toast("초기화했습니다.");
  });
  $("rbSave").addEventListener("click", function(){
    // 저장 = 라이브 반영: 역할 기본 권한 + 사용자별 개별 조정을 실제 세션에 적용
    DEFAULT_ROLE_PERMS = clone(r.roleDefs);
    USER_OVERRIDES = clone(r.overrides);
    renderSidebarNav();                 // 현재 로그인한 사용자 메뉴 즉시 갱신
    if (!navAllowed(SESSION.role, VIEW, navGranted())) navTo(firstNavId());  // 현재 화면 접근 불가 시 이동
    toast("저장되었습니다. 화면 접근 권한이 즉시 적용됩니다. (다른 역할은 다음 로그인 시 반영)");
  });
  $("rbLeft").querySelectorAll("[data-role]").forEach(function(b){ b.addEventListener("click", function(){ r.role=this.getAttribute("data-role"); renderMain(); }); });
  $("rbLeft").querySelectorAll("[data-user]").forEach(function(b){ b.addEventListener("click", function(){ r.userId=this.getAttribute("data-user"); renderMain(); }); });
  var qi = $("rbQ");
  if (qi) qi.addEventListener("input", function(){ r.q=this.value; renderMain(); var e=$("rbQ"); if(e){ e.focus(); e.setSelectionRange(e.value.length,e.value.length); } });
  $("rbTree").querySelectorAll("[data-toc]").forEach(function(b){ b.addEventListener("click", function(){ var k=this.getAttribute("data-toc"); r.open[k] = r.open[k]===false; renderMain(); }); });
  function setKey(key, next){
    if (r.mode==="role") r.roleDefs[r.role] = toggleRoleDef(r.roleDefs[r.role]||[], key, next);
    else { var u = users.filter(function(x){ return x.id===r.userId; })[0]; r.overrides[u.id] = togglePerm(r.overrides[u.id]||{grant:[],revoke:[]}, u.role, key, next); }
  }
  $("rbTree").querySelectorAll("[data-k]").forEach(function(b){ b.addEventListener("click", function(){ setKey(this.getAttribute("data-k"), this.getAttribute("data-next")==="1"); renderMain(); }); });
  $("rbTree").querySelectorAll("[data-cat]").forEach(function(b){ b.addEventListener("click", function(){
    var ck=this.getAttribute("data-cat"); var next = permCatState(ck, granted) !== "all";
    PERM_CATALOG.filter(function(c){ return c.key===ck; })[0].nodes.forEach(function(n){ setKey(n.key, next); });
    renderMain();
  }); });

  // 담당 배정 (권한과 별도)
  host.appendChild(h('<div class="grouphd" style="margin-top:22px">학생 담당 배정 (지도 교수 · 현장 책임자 · 현장 담당자)</div>'));
  var facs = users.filter(function(u){return u.role==="FACULTY";});
  var leads = users.filter(function(u){return u.role==="LEAD";});
  var fields = users.filter(function(u){return u.role==="FIELD";});
  function popt(arr,cur){ return arr.map(function(u){return '<option value="'+u.id+'"'+(u.id===cur?' selected':'')+'>'+esc(u.name)+'</option>';}).join(""); }

    var pl=DB.placement[s.id]||{};
    return '<tr><td>'+esc(s.name)+'<div class="tiny">'+esc(s.no)+'</div></td><td class="mut">'+esc(instName(s.institutionId))+'</td>' +
      '<td><select class="cell" data-sid="'+s.id+'" data-k="facultyId">'+popt(facs,pl.facultyId)+'</select></td>' +
      '<td><select class="cell" data-sid="'+s.id+'" data-k="leadId">'+popt(leads,pl.leadId)+'</select></td>' +
      '<td><select class="cell" data-sid="'+s.id+'" data-k="fieldId">'+popt(fields,pl.fieldId)+'</select></td></tr>';
  }).join("");

/* ================= 만족도 조사 (교수·행정 공용) — 학생용 / 기관용(책임자) ================= */
function surveyScreen(who){
  UI.svTab = UI.svTab || "student";
  var isInst = UI.svTab === "inst";
  var items = isInst ? DB.instSurveyItems : DB.surveyItems;
  var resp = DB.surveyResponses.filter(function(r){ return r.respondent === (isInst ? "INSTITUTION" : "STUDENT"); });
  pageShell("만족도 조사", "지도교수·학교 행정이 함께 관리합니다. ("+who+" 화면) · 학생용 5개 주제 / 기관용(현장실습 교육 책임자 → 학교) 3개 주제", "");
  var host = pbody();
  host.appendChild(tabsBar([["student","학생용 (실습기관·발전방향·사전교육/순회지도·만족도·개선사항)"],["inst","기관용 (프로그램 적절성·참여학생 평가·대학 지원)"]], UI.svTab, function(t){ UI.svTab=t; renderMain(); }));
  if (isInst) host.appendChild(h('<div class="notice" style="margin-bottom:14px">기관(현장실습 교육 책임자)의 학교 만족도 조사 결과입니다. <b>인증보고서 6.1.2 회의록</b>에 기재할 근거 자료로 활용합니다.</div>'));
  function avgOf(q){ var vals = resp.map(function(r){ return Number(r.answers[q.id]); }).filter(function(v){ return isFinite(v)&&v>0; }); return { avg: vals.length? vals.reduce(function(a,b){return a+b;},0)/vals.length : null, n: vals.length }; }
  var respondents = isInst ? DB.institutions.length : DB.students.length;
  host.appendChild(h('<div class="toolbar"><button type="button" class="btn btn-sm btn-out" id="svCsv">집계 CSV</button><button type="button" class="btn btn-sm btn-out" id="svPrn">인쇄 / PDF</button></div>'));
  host.appendChild(h('<div class="sumline">'+sumchip(isInst?"응답 기관":"응답 학생", resp.length+"곳/명")+sumchip("전체 대상", respondents+(isInst?"곳":"명"))+'</div>'));
  // 주제별 평균 + 문항별 평균
  var secs = surveySections(items), secRows = "", itemRows = "";
  secs.forEach(function(sec){
    var qs = sec.items.filter(function(q){ return q.type==="scale"; });
    if (!qs.length) return;
    var all = []; qs.forEach(function(q){ resp.forEach(function(r){ var v=Number(r.answers[q.id]); if(isFinite(v)&&v>0) all.push(v); }); });
    secRows += '<tr><td><b>'+esc(sec.title)+'</b></td><td class="num"><b>'+(all.length?(all.reduce(function(a,b){return a+b;},0)/all.length).toFixed(2):"-")+' / 5</b></td><td class="num">'+qs.length+'문항</td></tr>';
    qs.forEach(function(q){ var a=avgOf(q); itemRows += '<tr><td class="tiny mut">'+esc(sec.title)+'</td><td>'+esc(q.text)+'</td><td class="num">'+(a.avg==null?"-":a.avg.toFixed(2))+' / 5</td><td class="num">'+a.n+'명</td></tr>'; });
  });
  host.appendChild(h(card("주제별 평균","", tbl(["주제","평균","문항 수"], secRows))));
  host.appendChild(h(card("문항별 평균","", tbl(["주제","문항","평균","응답 수"], itemRows))));
  // 개별 응답 (+ 학생용: 공동 메모)
  var textItems = items.filter(function(q){ return q.type==="text"; });
  var indiv = resp.map(function(r){
    var title = isInst ? (instName(r.institutionId)+' <span class="tiny">'+esc(r.by||"")+'</span>') : (function(){ var s=studentById(r.studentId); return esc(s?s.name:r.studentId)+' · '+esc(s?instName(s.institutionId):""); })();
    var ans = items.filter(function(q){return q.type==="scale";}).map(function(q){ return '<span class="tiny" style="margin-right:10px">'+esc(q.id)+': <b>'+esc(r.answers[q.id]||"-")+'</b></span>'; }).join("");
    var free = textItems.filter(function(q){ return String(r.answers[q.id]||"").trim(); }).map(function(q){ return '<div style="font-size:13px;margin-top:4px">'+esc(q.text)+'<br><b>'+esc(r.answers[q.id])+'</b></div>'; }).join("");
    var note = DB.surveyNotes[r.studentId] || { faculty:"", staff:"" };
    return '<div class="card"><div class="card-bd"><b>'+title+'</b>'+free+'<div style="margin-top:6px">'+ans+'</div>' +
      (isInst ? '' : '<div class="fldrow" style="margin-top:10px;grid-template-columns:1fr 1fr">' +
      '<label class="lb">교수 메모<textarea class="in" data-note="'+r.studentId+'" data-side="faculty" rows="2">'+esc(note.faculty)+'</textarea></label>' +
      '<label class="lb">행정 메모<textarea class="in" data-note="'+r.studentId+'" data-side="staff" rows="2">'+esc(note.staff)+'</textarea></label></div>') +
      '</div></div>';
  }).join("");
  host.appendChild(h('<div class="grouphd">개별 응답'+(isInst?'':' · 공동 메모')+'</div>'));
  var wrap = h('<div>'+(indiv||'<div class="empty">응답이 없습니다.</div>')+'</div>'); host.appendChild(wrap);
  wrap.querySelectorAll("[data-note]").forEach(function(t){
    t.addEventListener("change", function(){
      var sid=this.getAttribute("data-note"), side=this.getAttribute("data-side");
      DB.surveyNotes[sid] = DB.surveyNotes[sid] || { faculty:"", staff:"" };
      DB.surveyNotes[sid][side] = this.value; toast("메모를 저장했습니다.");
    });
  });
  // 문항 관리
  host.appendChild(h('<div class="grouphd">조사 문항 관리</div>'));
  var qrows = items.map(function(q){
    return '<tr><td class="tiny mut">'+esc(q.section||"")+'</td><td><input class="cell" data-qid="'+q.id+'" value="'+esc(q.text)+'" style="width:100%"></td><td class="mut">'+(q.type==="scale"?"5점 척도":"주관식")+'</td><td><button type="button" class="btn btn-sm btn-danger" data-qdel="'+q.id+'">삭제</button></td></tr>';
  }).join("");
  var qc = h(card("문항 목록", "", tbl(["주제","문항","유형","처리"], qrows) +
    '<div class="toolbar" style="margin-top:12px"><select class="cell" id="nqSec">'+secs.map(function(s){ return '<option>'+esc(s.title)+'</option>'; }).join("")+'</select><input class="cell" id="nqText" placeholder="새 문항" style="flex:1;max-width:none"><select class="cell" id="nqType"><option value="scale">5점 척도</option><option value="text">주관식</option></select><button type="button" class="btn btn-sm btn-grad" id="nqAdd">추가</button></div>'));
  host.appendChild(qc);
  qc.querySelectorAll("[data-qid]").forEach(function(inp){ inp.addEventListener("change", function(){ var q=items.filter(function(x){return x.id===this.getAttribute("data-qid");}.bind(this))[0]; q.text=this.value; toast("문항을 수정했습니다."); }); });
  qc.querySelectorAll("[data-qdel]").forEach(function(b){ b.addEventListener("click", function(){ var id=this.getAttribute("data-qdel"); var arr=items.filter(function(x){return x.id!==id;}); if(isInst) DB.instSurveyItems=arr; else DB.surveyItems=arr; renderMain(); toast("문항을 삭제했습니다."); }); });
  $("nqAdd").addEventListener("click", function(){
    var t=$("nqText").value.trim(); if(!t) return;
    items.push({ id:(isInst?"I_":"S_")+Date.now(), section:$("nqSec").value, text:t, type:$("nqType").value }); renderMain(); toast("문항을 추가했습니다.");
  });
  $("svCsv").addEventListener("click", function(){
    var out=[["주제","문항","평균(5점)","응답 수"]];
    secs.forEach(function(sec){ sec.items.filter(function(q){return q.type==="scale";}).forEach(function(q){ var a=avgOf(q); out.push([sec.title,q.text,a.avg==null?"":a.avg.toFixed(2),a.n]); }); });
    downloadCSV(isInst?"기관만족도_집계.csv":"학생만족도_집계.csv", out); toast("CSV를 내려받았습니다.");
  });
  $("svPrn").addEventListener("click", function(){ window.print(); });
}

    }).join("");
    var act;

    else if (l.status==="DRAFT") act = '<p class="notice" style="margin-top:12px;background:#F5F7F8;color:#6B7680">아직 학생이 제출하지 않은 초안입니다.</p>';
    else act = '<div style="margin-top:14px;border:1px solid #E3E7EA;border-radius:12px;padding:12px"><label class="lb">정성적 피드백 <span class="tiny" style="font-weight:400">(반려 시 필수 · 승인 시 선택)</span></label>' +

      '<div class="btnrow" style="justify-content:flex-start;margin-top:10px"><button type="button" class="btn btn-grad" id="fdConfirm">✓ 승인</button><button type="button" class="btn btn-danger" id="fdReturn">↺ 반려</button><span class="tiny">승인하면 <b>승인 완료</b>로 처리됩니다. (지도교수 매회 승인 없음)</span></div></div>';
    m.innerHTML = card(l.logDate + "  ", badge(LOGST,l.status),
      '<h3 style="font-size:15px;font-weight:800">'+esc(l.title)+'</h3><p class="tiny">'+esc(l.practiceArea)+' · '+esc(l.workHours)+'시간'+(l.submittedAt?' · 제출 '+esc(fmtDT(l.submittedAt)):'')+'</p>' +

      '<div style="margin-top:12px"><div class="lb" style="color:#245860">학습 내용 (이론·지식)</div><div style="white-space:pre-wrap;font-size:13px;color:#2F3A44">'+esc(l.learningContent)+'</div></div>' +
      '<div style="margin-top:12px"><div class="lb" style="color:#245860">소감·고찰</div><div style="white-space:pre-wrap;font-size:13px;color:#2F3A44">'+esc(l.reflection)+'</div></div>' +
      ((l.photos&&l.photos.length)?'<div style="margin-top:12px"><div class="lb" style="color:#245860">첨부 사진</div>'+photoStrip(l.photos)+'</div>':'') +

    var cmt = $("fdCmt"); if (cmt) cmt.addEventListener("input", function(){ UI.fieldCmt = this.value; });

      var c = (UI.fieldCmt||"").trim();
      l.reviews.push({ reviewerName:SESSION.name, reviewerRole:"FIELD", action:c?"COMMENT":"APPROVE", comment:c||"현장 확인 완료. 승인합니다.", createdAt:new Date().toISOString() });
      l.status="APPROVED"; UI.fieldCmt=""; renderMain(); toast("승인했습니다. 일지가 승인 완료 처리되었습니다.");
    });
    var rt = $("fdReturn"); if (rt) rt.addEventListener("click", function(){
      var c = (UI.fieldCmt||"").trim(); if (!c){ toast("반려 사유(피드백)를 입력하세요."); return; }
      l.reviews.push({ reviewerName:SESSION.name, reviewerRole:"FIELD", action:"RETURN", comment:c, createdAt:new Date().toISOString() });
      l.status="RETURNED"; UI.fieldCmt=""; renderMain(); toast("반려했습니다.");
    });

};

/* 현장(책임자/담당자) 공용: 실습일지 달력 한눈에 */

  var host = pbody();
  if (!list.length){ host.appendChild(h('<div class="empty">담당 실습생이 없습니다.</div>')); return; }
  UI.fcSid = UI.fcSid && list.filter(function(s){return s.id===UI.fcSid;}).length ? UI.fcSid : list[0].id;
  var sel = h('<div class="toolbar"><label class="lb" style="margin:0">실습생</label><select class="cell" id="fcStu">'+list.map(function(s){return '<option value="'+s.id+'"'+(s.id===UI.fcSid?' selected':'')+'>'+esc(s.name)+' ('+esc(s.no)+')</option>';}).join("")+'</select></div>');
  host.appendChild(sel);

      back.addEventListener("click", function(){ UI.fcOpen=null; renderMain(); });
      host.appendChild(back);
      host.appendChild(h(card(l.logDate+" · "+l.title, badge(LOGST,l.status),
        s2("실습 내용", l.practiceContent)+s2("학습 내용", l.learningContent)+s2("소감·고찰", l.reflection)+((l.photos&&l.photos.length)?'<div style="margin-top:10px"><div class="lb" style="color:#245860">첨부 사진</div>'+photoStrip(l.photos)+'</div>':''))));
      function s2(t,x){ return '<div style="margin-top:10px"><div class="lb" style="color:#245860">'+esc(t)+'</div><div style="white-space:pre-wrap;font-size:13px">'+esc(x)+'</div></div>'; }
    }
  }
}
/* 실습생 평가표 (기관 → 학교) — 영역·항목·배점은 기관이 세팅(융통성), 합계는 100점으로 환산 */
function fieldEvalScreen(list){
  pageShell("실습생 평가표 (기관 → 학교)", "실습 종료 후 현장실습 교육 책임자가 실습생 평가표를 작성·제출합니다. 평가 영역·항목·배점은 기관 실정에 맞게 직접 세팅할 수 있습니다. (전자서명 필요)", "");
  var host = pbody();
  if (!list.length){ host.appendChild(h('<div class="empty">담당 실습생이 없습니다.</div>')); return; }
  UI.feSid = UI.feSid && list.filter(function(s){return s.id===UI.feSid;}).length ? UI.feSid : list[0].id;
  var iid = SESSION.institutionId || studentById(UI.feSid).institutionId;
  function itemsNow(){ return evalItemsFor(iid); }
  function ensureOwn(){ if (!(DB.evalItemsInst[iid] && DB.evalItemsInst[iid].length)) DB.evalItemsInst[iid] = clone(DB.evalItems.FIELD); return DB.evalItemsInst[iid]; }
  var items = itemsNow();
  host.appendChild(h('<div class="toolbar"><label class="lb" style="margin:0">실습생</label><select class="cell" id="feStu">'+list.map(function(s){return '<option value="'+s.id+'"'+(s.id===UI.feSid?' selected':'')+'>'+esc(s.name)+'</option>';}).join("")+'</select><span class="sp"></span><button type="button" class="btn btn-sm btn-out" id="feCfg">'+(UI.feCfg?"평가 항목 설정 닫기":"평가 항목 설정")+'</button></div>'));
  $("feStu").addEventListener("change", function(){ UI.feSid=this.value; renderMain(); });
  $("feCfg").addEventListener("click", function(){ UI.feCfg=!UI.feCfg; renderMain(); });
  // 평가 항목 설정
  if (UI.feCfg){
    var mx = items.reduce(function(t,it){ return t+(Number(it.max)||0); },0);
    var cr = items.map(function(it){
      return '<tr><td><input class="cell" data-ic="'+it.id+'" value="'+esc(it.category)+'" style="width:100px"></td><td><input class="cell" data-ii="'+it.id+'" value="'+esc(it.item)+'" style="width:100%"></td><td><input class="cell" type="number" min="0" data-im="'+it.id+'" value="'+esc(it.max)+'" style="width:64px;text-align:right"></td><td><button type="button" class="btn btn-sm btn-danger" data-idel="'+it.id+'">삭제</button></td></tr>';
    }).join("");
    var cc = h(card("평가 항목 설정 — "+esc(instName(iid)), '배점 합계 '+mx+' (100점으로 환산)',
      tbl(["영역","평가 항목","배점",""], cr) +
      '<div class="toolbar" style="margin-top:12px"><input class="cell" id="niCat" placeholder="영역 (예: 기타 업무)" style="width:130px"><input class="cell" id="niItem" placeholder="평가 항목 (예: 기자재·물품 관리 협조도)" style="flex:1;max-width:none"><input class="cell" id="niMax" type="number" min="0" placeholder="배점" style="width:70px"><button type="button" class="btn btn-sm btn-grad" id="niAdd">항목 추가</button><button type="button" class="btn btn-sm btn-out" id="niReset">기본 틀로 되돌리기</button></div>' +
      '<p class="tiny" style="margin-top:6px">원무·의무기록 외에 기자재 관리, 세탁물 관리, 물품 운반 등 기관 사정에 따른 실습 업무도 평가 항목으로 넣을 수 있습니다.</p>'));
    host.appendChild(cc);
    function fi(id){ return ensureOwn().filter(function(x){return x.id===id;})[0]; }
    cc.querySelectorAll("[data-ic]").forEach(function(i){ i.addEventListener("change", function(){ fi(this.getAttribute("data-ic")).category=this.value; renderMain(); }); });
    cc.querySelectorAll("[data-ii]").forEach(function(i){ i.addEventListener("change", function(){ fi(this.getAttribute("data-ii")).item=this.value; renderMain(); }); });
    cc.querySelectorAll("[data-im]").forEach(function(i){ i.addEventListener("change", function(){ fi(this.getAttribute("data-im")).max=Math.max(0,Number(this.value)||0); renderMain(); }); });
    cc.querySelectorAll("[data-idel]").forEach(function(b){ b.addEventListener("click", function(){ var id=this.getAttribute("data-idel"); DB.evalItemsInst[iid]=ensureOwn().filter(function(x){return x.id!==id;}); renderMain(); }); });
    $("niAdd").addEventListener("click", function(){ var t=$("niItem").value.trim(); if(!t){ toast("평가 항목을 입력하세요."); return; } ensureOwn().push({ id:"x"+Date.now(), category:$("niCat").value.trim()||"기타", item:t, max:Math.max(0,Number($("niMax").value)||10) }); renderMain(); });
    $("niReset").addEventListener("click", function(){ delete DB.evalItemsInst[iid]; renderMain(); toast("기본 틀로 되돌렸습니다."); });
  }
  var box=h('<div id="feBox"></div>'); host.appendChild(box);
  var sid=UI.feSid;
  var ev = evalOf(sid,"FIELD") || { id:"e_"+Date.now(), studentId:sid, kind:"FIELD", scores:{}, overall:"", tasks:"", status:"DRAFT" };
  if (!evalOf(sid,"FIELD")) DB.evaluations.push(ev);
  var readonly = ev.status==="CONFIRMED";
  function total(sc){ return evalTotal(items, sc); }
  var rowsH = items.map(function(it){
    var v=ev.scores[it.id]; v=(v==null||v==="")?"":v;
    var cell = readonly? '<b>'+esc(v===""?"-":v)+'</b> / '+it.max : '<input class="cell" type="number" min="0" max="'+it.max+'" data-it="'+it.id+'" value="'+esc(v)+'" style="width:70px;text-align:right"> / '+it.max;
    return '<tr><td class="mut">'+esc(it.category)+'</td><td>'+esc(it.item)+'</td><td class="num">'+cell+'</td></tr>';
  }).join("");
  var t = readonly? ev.totalScore : total(ev.scores);
  box.innerHTML = card("평가 항목 "+badge(EVST,ev.status), "합계 "+t+" / 100 · 등급 "+gradeOf(t),
    tbl(["영역","평가 항목","배점"], rowsH) +
    '<label class="lb" style="margin-top:12px">실습 수행 업무 내역 <span class="tiny" style="font-weight:400">(원무·의무기록 외 기자재 관리·세탁물 관리·물품 운반 등 포함)</span>'+(readonly?'<p style="white-space:pre-wrap;font-size:13px">'+esc(ev.tasks||"-")+'</p>':'<textarea class="in" id="feTasks" rows="2">'+esc(ev.tasks||"")+'</textarea>')+'</label>' +
    '<label class="lb" style="margin-top:12px">현장 지도자 총평'+(readonly?'<p style="white-space:pre-wrap;font-size:13px">'+esc(ev.overall||"-")+'</p>':'<textarea class="in" id="feOv" rows="3">'+esc(ev.overall||"")+'</textarea>')+'</label>' +
    (readonly? sigBlock(ev.signature)+'<div class="btnrow"><button type="button" class="btn btn-out" id="feEdit">평가 수정</button></div>'
             : sigHTML("feSig", SESSION.name, "평가 제출 시 필수")+'<p class="err" id="feErr" hidden></p><div class="btnrow"><button type="button" class="btn btn-out" id="feSaveD">임시저장</button><button type="button" class="btn btn-grad" id="feSubmit">평가 제출</button></div>'));
  if (!readonly){
    sigInit("feSig");
    box.querySelectorAll("[data-it]").forEach(function(inp){
      inp.addEventListener("input", function(){
        var it=items.filter(function(x){return x.id===this.getAttribute("data-it");}.bind(this))[0];
        var v=this.value===""?"":Math.max(0,Math.min(it.max,Number(this.value)));
        if(v!==""&&String(v)!==this.value) this.value=v;
        ev.scores[this.getAttribute("data-it")]=v;
        var tt=total(ev.scores); box.querySelector(".act").textContent="합계 "+tt+" / 100 · 등급 "+gradeOf(tt);
      });
    });
    var ov=$("feOv"); if(ov) ov.addEventListener("input", function(){ ev.overall=this.value; });
    var tk=$("feTasks"); if(tk) tk.addEventListener("input", function(){ ev.tasks=this.value; });
    $("feSaveD").addEventListener("click", function(){ ev.status="DRAFT"; toast("임시저장되었습니다."); });
    $("feSubmit").addEventListener("click", function(){
      var miss=items.filter(function(it){ var v=ev.scores[it.id]; return v==null||v===""; });
      if(miss.length){ $("feErr").textContent="모든 항목 점수를 입력하세요."; $("feErr").hidden=false; return; }
      if(!String(ev.overall||"").trim()){ $("feErr").textContent="총평을 입력하세요."; $("feErr").hidden=false; return; }
      var sg=sigRead("feSig"); if(!sg.ok){ $("feErr").textContent=sg.reason; $("feErr").hidden=false; return; }
      ev.status="SUBMITTED"; ev.totalScore=total(ev.scores); ev.grade=gradeOf(ev.totalScore);
      ev.signature={name:sg.name,dataUrl:sg.dataUrl,signedAt:sg.signedAt};
      renderMain(); toast("전자서명과 함께 현장 평가표를 제출했습니다.");
    });
  } else {
    $("feEdit").addEventListener("click", function(){ ev.status="DRAFT"; ev.signature=null; renderMain(); });
  }
}

RENDER.STAFF.home = function(){
  var docMiss = DB.documents.filter(function(d){ return d.status==="REQUESTED"||d.status==="REJECTED"; });
  var docWait = DB.documents.filter(function(d){ return d.status==="SUBMITTED"; });
  var stuDocPending = 0, stuDocNames = [];
  DB.students.forEach(function(s){
    var ex = stuExtra(s.id), miss = DB.reqDocList.filter(function(rd){ return (ex.docs[rd.id]||"NONE")!=="VERIFIED"; }).length;
    if (miss){ stuDocPending += miss; stuDocNames.push(s.name+" ("+miss+")"); }
  });
  var active = DB.students.filter(function(s){ return s.start <= TODAY && TODAY <= s.end; });
  var byInst = {}; DB.students.forEach(function(s){ (byInst[s.institutionId]=byInst[s.institutionId]||[]).push(s); });
  pageShell("홈", "학교 행정 · 현장실습 파견/서류 현황  ("+DB.term.name+")", "");
  var host = pbody();
  host.appendChild(h('<div class="grid stats">' +
    '<div class="stat"><div class="k">현재 실습 중 학생</div><div class="v">'+active.length+' / '+DB.students.length+'명</div></div>' +
    '<div class="stat"><div class="k">파견 실습기관</div><div class="v">'+Object.keys(byInst).length+'곳</div></div>' +
    '<div class="stat'+(docMiss.length?' warn':'')+'"><div class="k">미제출·반려 서류</div><div class="v">'+docMiss.length+'건</div></div>' +
    '<div class="stat'+(docWait.length?' warn':'')+'"><div class="k">수신 확인 대기</div><div class="v">'+docWait.length+'건</div></div>' +
    '</div>'));
  var irows = Object.keys(byInst).map(function(iid){
    var g = byInst[iid];
    return '<tr><td>'+esc(instName(iid))+'</td><td class="num">'+g.length+'명</td><td class="tiny mut">'+esc(g.map(function(s){return s.name+" ("+s.area+")";}).join(", "))+'</td></tr>';
  }).join("");
  host.appendChild(h(card("실습기관별 파견 인원", DB.students.length+"명", tbl(["실습기관","인원","학생 · 영역"], irows))));
  var goDoc = function(){ UI.docTab="receive"; navTo("documents"); };
  if (docMiss.length || docWait.length){
    var drows = docMiss.concat(docWait).map(function(d){
      return '<tr><td class="mut">'+esc(d.scope)+'</td><td>'+esc(d.target)+'</td><td>'+esc(d.label)+'</td><td class="num">'+esc(d.dueDate)+'</td><td>'+badge(DOCST,d.status)+'</td></tr>';
    }).join("");
    var dc = h(card("처리 필요 서류 (기관·학생 제출)", (docMiss.length+docWait.length)+"건",
      tbl(["구분","대상","서류","마감","상태"], drows) + '<div class="btnrow"><button type="button" class="btn btn-sm btn-grad" id="goDocBtn">서류 관리로 이동</button></div>'));
    host.appendChild(dc);
    $("goDocBtn").addEventListener("click", goDoc);
  }
  host.appendChild(h(card("학생 필수 제출 서류 미완료", stuDocPending+"건",
    stuDocPending ? '<div style="font-size:13px;color:#3B4650">개인정보 서약서·보건증·예방접종·IGRA·이수계획서 등 — <b>'+esc(stuDocNames.join(", "))+'</b>' +
      '<p class="tiny" style="margin-top:6px">학생 [제출 서류] 업로드 → 학교 행정 [서류 관리]에서 수신 확인</p></div>'

    attArr.push(pct(a.done,rq.days)); logArr.push(pct(logStat(s.id).submitted,rq.logs));
    hoursArr.push(Math.round(attOf(s.id).reduce(function(t,r){return t+(r.workMinutes||0);},0)/60));
  });
  function avg(arr){ return arr.length? Math.round(arr.reduce(function(a,b){return a+b;},0)/arr.length):0; }

    return { n:rs.length, avg: vals.length? (vals.reduce(function(a,b){return a+b;},0)/vals.length).toFixed(2):"-" };
  }
  var sv = svAvgOf("STUDENT", DB.surveyItems), iv = svAvgOf("INSTITUTION", DB.instSurveyItems);

    tbl(["학번","성명","실습기관","실습 기준","이수시간","출석 진행률","일지 진행률","최종점수/학점"], DB.students.map(function(s){
      var a=attSummary(attOf(s.id)), fin=finalScore(s.id), rq=reqOf(s);
      var hh=Math.round(attOf(s.id).reduce(function(t,r){return t+(r.workMinutes||0);},0)/60);
      return '<tr><td>'+esc(s.no)+'</td><td>'+esc(s.name)+'</td><td class="mut">'+esc(instName(s.institutionId))+'</td><td class="tiny">'+esc(rq.label)+'</td>' +
        '<td class="num">'+hh+'h / '+rq.hours+'h</td><td class="num">'+pct(a.done,rq.days)+'%</td><td class="num">'+pct(logStat(s.id).submitted,rq.logs)+'%</td><td class="num">'+(fin==null?"-":fin+" ("+gradeOf(fin)+")")+'</td></tr>';
    }).join("")) )));

    downloadCSV("현장실습_종합통계_KPI.csv", out); toast("KPI 통계를 내려받았습니다.");

    DB.accessLogs.forEach(function(l){ out.push([l.at,l.user,l.action,l.ip,l.ep,l.st]); });
    downloadCSV("접속로그.csv", out); toast("CSV를 내려받았습니다.");
  });
  draw();
};
RENDER.ADMIN.backup = function(){
  pageShell("백업 관리", "", "");
  var host = pbody();
  var last = DB.backups.filter(function(b){return b.status==="SUCCESS";})[0];
  var running = DB.backups.some(function(b){return b.status==="RUNNING";});
  host.appendChild(h('<div class="sumline">'+sumchip("마지막 성공 백업", last?last.at:"없음")+sumchip("보관 백업", DB.backups.length+"개")+sumchip("자동 백업", "매일 22:00")+'</div>'));
  host.appendChild(h('<div class="toolbar"><label class="switch"><input type="checkbox" id="abk" checked> 자동 백업 사용</label><span class="sp"></span><button type="button" class="btn btn-sm btn-grad" id="runBk"'+(running?' disabled':'')+'>'+(running?"백업 중…":"지금 백업 실행")+'</button></div>'));
  var rows = DB.backups.map(function(b){
    return '<tr><td class="num tiny">'+esc(b.at)+'</td><td>'+(b.type==="FULL"?"전체":"증분")+'</td><td class="num">'+(b.status==="RUNNING"?"-":b.sizeMB+" MB")+'</td>' +
      '<td>'+badge({SUCCESS:["성공","b-teal"],FAILED:["실패","b-rose"],RUNNING:["진행 중","b-amber"]}, b.status)+'</td><td class="tiny">'+esc(b.by)+'</td>' +
      '<td>'+(b.status==="SUCCESS"?'<button type="button" class="btn btn-sm btn-out" data-bk="'+b.id+'">다운로드</button>':'<span class="tiny">-</span>')+'</td></tr>';
  }).join("");
  host.appendChild(h(tbl(["시각","유형","크기","상태","실행","파일"], rows)));
  $("runBk").addEventListener("click", function(){
    var id="b_"+Date.now();
    DB.backups.unshift({ id:id, at:TODAY+" "+new Date().toTimeString().slice(0,5), type:"INCREMENTAL", sizeMB:0, status:"RUNNING", by:"admin" });
    renderMain(); toast("백업을 시작했습니다…");
    setTimeout(function(){ var b=DB.backups.filter(function(x){return x.id===id;})[0]; if(b){ b.status="SUCCESS"; b.sizeMB=40+Math.floor(Math.random()*20); } renderMain(); toast("백업 완료"); }, 1400);
  });
  host.querySelectorAll("[data-bk]").forEach(function(b){
    b.addEventListener("click", function(){
      var bk=DB.backups.filter(function(x){return x.id===this.getAttribute("data-bk");}.bind(this))[0];
      var blob=new Blob(["-- 데모 백업 플레이스홀더\n-- "+bk.at+"\n"], {type:"text/plain"});
      var url=URL.createObjectURL(blob); var a=document.createElement("a"); a.href=url; a.download="backup_"+bk.id+".sql";
      document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(function(){URL.revokeObjectURL(url);},800);
      toast("백업 파일을 내려받았습니다.");
    });
  });
};

function BOOT(){
  try {
    initUsers();
    var lg=$("lgBtn"); if(lg) lg.addEventListener("click", LOGIN);
    var su=$("suBtn"); if(su) su.addEventListener("click", SIGNUP);
    var p1=$("lgPw"); if(p1) p1.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.keyCode===13){ e.preventDefault(); LOGIN(); } });
    var p2=$("suPw2"); if(p2) p2.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.keyCode===13){ e.preventDefault(); SIGNUP(); } });
    SHOW("login");
  } catch (e) { report("초기화 오류: "+(e&&e.message?e.message:e)); }
}
if (document.readyState==="loading") document.addEventListener("DOMContentLoaded", BOOT);
else BOOT();
